[binaries]
c = ['clang', '--target=armv7-alpine-linux-musleabihf', '--sysroot=/work/build/mesa-sysroot', '--gcc-toolchain=/work/build/mesa-sysroot/usr']
cpp = ['clang++', '--target=armv7-alpine-linux-musleabihf', '--sysroot=/work/build/mesa-sysroot', '--gcc-toolchain=/work/build/mesa-sysroot/usr']
ar = 'llvm-ar'
strip = 'llvm-strip'
pkg-config = 'pkg-config'

[host_machine]
system = 'linux'
cpu_family = 'arm'
cpu = 'cortex-a9'
endian = 'little'

[properties]
needs_exe_wrapper = true
sys_root = '/work/build/mesa-sysroot'
pkg_config_libdir = ['/work/build/mesa-sysroot/usr/lib/pkgconfig', '/work/build/mesa-sysroot/usr/share/pkgconfig']

[built-in options]
c_args = ['-march=armv7-a', '-mfpu=vfpv3-d16', '-mfloat-abi=hard', '-DNO_FORMAT_ASM']
cpp_args = ['-march=armv7-a', '-mfpu=vfpv3-d16', '-mfloat-abi=hard', '-DNO_FORMAT_ASM']
c_link_args = ['-fuse-ld=lld']
cpp_link_args = ['-fuse-ld=lld']
